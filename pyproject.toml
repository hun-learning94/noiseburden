[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noiseburden"
version = "0.3.0"
description = "Reproducibility code and metrics for the noise-transmission burden in diffusion networks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["noiseburden", "training", "evaluation", "training_cache", "revision", "calibration", "calibration.frozen", "rebuttal", "synthetic_width", "pyramid_calibration", "pyramid_calibration.frozen"]

[tool.setuptools.package-data]
"calibration.frozen" = ["jit/*.py", "jit/LICENSE", "jit/util/*.py"]
"synthetic_width" = ["data/*.pt", "data/*.json"]
"pyramid_calibration.frozen" = ["pyramid_jit/*.py", "pyramid-LICENSE", "pyramid-pyproject.toml", "torch_fidelity/*.py", "torch-fidelity-LICENSE.md"]
