[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noiseburden"
version = "0.1.0"
description = "Reproducibility code and metrics for the noise-transmission burden in diffusion networks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["noiseburden", "training", "evaluation", "training_cache"]
